<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>PromiseGap Reset password</title>
    <script src="./support.js"></script>
</head>

<body>
    <x-dc>
        <helmet>
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link
                href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
                rel="stylesheet">
            <style>
                body {
                    margin: 0
                }

                a {
                    color: #7FA3FF
                }

                a:hover {
                    color: #A9C0FF
                }
            </style>
        </helmet>
        <div
            style="min-height: 900px; box-sizing: border-box; background: #0E1116; color: #E8ECF1; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column">

            <div style="padding: 32px 48px">
                <a href="Landing.dc.html"
                    style="display: inline-flex; align-items: center; gap: 12px; text-decoration: none; color: #E8ECF1">
                    <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
                        <rect x="2" y="5" width="14" height="14" rx="3" stroke="#7FA3FF" stroke-width="2" />
                        <rect x="12" y="9" width="14" height="14" rx="3" stroke="#B7C0CC" stroke-width="2" />
                    </svg>
                    <span style="font-size: 18px; font-weight: 700; letter-spacing: -0.01em">PromiseGap</span>
                </a>
            </div>

            <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px 24px 96px">
                <div
                    style="width: 100%; max-width: 460px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px; padding: 36px; background: #151A21; border: 1px solid #2A323D; border-radius: 20px">

                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#7FA3FF" stroke-width="1.8"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="5" y="11" width="14" height="10" rx="2" />
                        <path d="M8 11V8a4 4 0 0 1 8 0v3" />
                        <path d="M12 15v2" />
                    </svg>

                    <div style="display: flex; flex-direction: column; gap: 10px">
                        <h1 style="margin: 0; font-size: 30px; letter-spacing: -0.02em; font-weight: 700">Choose a new
                            password</h1>
                        <p style="margin: 0; font-size: 16px; line-height: 1.55; color: #9BA5B3">This link is valid for
                            another 58 minutes.</p>
                    </div>

                    <form style="display: flex; flex-direction: column; gap: 18px">
                        <div style="display: flex; flex-direction: column; gap: 8px">
                            <label for="new" style="font-size: 14px; font-weight: 500">New password</label>
                            <input id="new" type="password" autocomplete="new-password"
                                placeholder="At least 12 characters"
                                style="box-sizing: border-box; width: 100%; min-height: 48px; padding: 0 14px; background: #0E1116; border: 1px solid #3A4553; border-radius: 10px; color: #E8ECF1; font: inherit; font-size: 16px">
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 8px">
                            <label for="confirm" style="font-size: 14px; font-weight: 500">Confirm password</label>
                            <input id="confirm" type="password" autocomplete="new-password" placeholder="Type it again"
                                style="box-sizing: border-box; width: 100%; min-height: 48px; padding: 0 14px; background: #0E1116; border: 1px solid #3A4553; border-radius: 10px; color: #E8ECF1; font: inherit; font-size: 16px">
                        </div>

                        <div
                            style="display: flex; flex-direction: column; gap: 10px; padding: 16px; background: #0E1116; border: 1px solid #2A323D; border-radius: 12px; font-size: 14px">
                            <span style="display: flex; align-items: center; gap: 10px; color: #4ADE9A"><svg width="16"
                                    height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <circle cx="12" cy="12" r="9" />
                                    <path d="M8 12.5l2.7 2.7L16 9.5" />
                                </svg>12 characters or more</span>
                            <span style="display: flex; align-items: center; gap: 10px; color: #4ADE9A"><svg width="16"
                                    height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <circle cx="12" cy="12" r="9" />
                                    <path d="M8 12.5l2.7 2.7L16 9.5" />
                                </svg>Contains a number</span>
                            <span style="display: flex; align-items: center; gap: 10px; color: #9BA5B3"><svg width="16"
                                    height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <circle cx="12" cy="12" r="9" />
                                </svg>Both fields match</span>
                        </div>

                        <a href="Login.dc.html"
                            style="display: flex; align-items: center; justify-content: center; min-height: 52px; background: #7FA3FF; color: #0B1020; border-radius: 12px; font-size: 17px; font-weight: 600; text-decoration: none">Update
                            password</a>
                    </form>

                    <a href="Login.dc.html"
                        style="display: inline-flex; align-items: center; gap: 8px; width: fit-content; min-height: 44px; font-size: 15px; text-decoration: none"><svg
                            width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M15 6l-6 6 6 6" />
                        </svg>Back to sign in</a>

                </div>
            </div>

        </div>
    </x-dc>
    <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>

</html>
