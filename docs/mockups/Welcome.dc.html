<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>PromiseGap First connection</title>
    <script src="./support.js"></script>
</head>

<body>
    <x-dc>
        <helmet>
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link
                href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
                rel="stylesheet">
            <style>
                body {
                    margin: 0
                }

                a {
                    color: #7FA3FF
                }

                a:hover {
                    color: #A9C0FF
                }
            </style>
        </helmet>
        <div
            style="min-height: 900px; box-sizing: border-box; background: #0E1116; color: #E8ECF1; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column">

            <div
                style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 32px 48px">
                <div style="display: flex; align-items: center; gap: 12px">
                    <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
                        <rect x="2" y="5" width="14" height="14" rx="3" stroke="#7FA3FF" stroke-width="2" />
                        <rect x="12" y="9" width="14" height="14" rx="3" stroke="#B7C0CC" stroke-width="2" />
                    </svg>
                    <span style="font-size: 18px; font-weight: 700; letter-spacing: -0.01em">PromiseGap</span>
                </div>
                <a href="Main.dc.html" style="font-size: 14px; color: #9BA5B3; text-decoration: none">Skip for now</a>
            </div>

            <div
                style="flex: 1; width: 100%; max-width: 760px; margin: 0 auto; box-sizing: border-box; padding: 24px 32px 72px; display: flex; flex-direction: column; gap: 36px">

                <div style="display: flex; flex-wrap: wrap; gap: 12px">
                    <sc-for list="{{ steps }}" as="s" hint-placeholder-count="3">
                        <div style="flex: 1 1 160px; display: flex; flex-direction: column; gap: 8px">
                            <div style="height: 4px; border-radius: 999px; background: {{ s.bar }}"></div>
                            <span
                                style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.06em; color: {{ s.color }}">{{
                                s.label }}</span>
                        </div>
                    </sc-for>
                </div>

                <sc-if value="{{ isStep1 }}" hint-placeholder-val="{{ true }}">
                    <div style="display: flex; flex-direction: column; gap: 28px">
                        <div style="display: flex; flex-direction: column; gap: 10px">
                            <h1 style="margin: 0; font-size: 36px; letter-spacing: -0.02em; font-weight: 700">Welcome to
                                PromiseGap</h1>
                            <p style="margin: 0; font-size: 17px; line-height: 1.55; color: #9BA5B3">Two quick questions
                                so the cockpit fits the way you work.</p>
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 8px">
                            <label for="workspace" style="font-size: 14px; font-weight: 500">Workspace name</label>
                            <input id="workspace" type="text" placeholder="Your company or team"
                                style="box-sizing: border-box; width: 100%; min-height: 48px; padding: 0 14px; background: #151A21; border: 1px solid #3A4553; border-radius: 10px; color: #E8ECF1; font: inherit; font-size: 16px">
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 12px">
                            <span style="font-size: 14px; font-weight: 500">What best describes your role?</span>
                            <div style="display: flex; flex-wrap: wrap; gap: 12px">
                                <sc-for list="{{ roles }}" as="r" hint-placeholder-count="4">
                                    <button type="button" onClick="{{ r.pick }}"
                                        style="flex: 1 1 280px; box-sizing: border-box; min-height: 64px; display: flex; flex-direction: column; justify-content: center; gap: 2px; text-align: left; padding: 12px 16px; background: {{ r.bg }}; border: 2px solid {{ r.border }}; border-radius: 12px; color: #E8ECF1; font: inherit; cursor: pointer">
                                        <span style="font-size: 16px; font-weight: 600">{{ r.title }}</span>
                                        <span style="font-size: 13px; color: #9BA5B3">{{ r.hint }}</span>
                                    </button>
                                </sc-for>
                            </div>
                        </div>
                    </div>
                </sc-if>

                <sc-if value="{{ isStep2 }}" hint-placeholder-val="{{ false }}">
                    <div style="display: flex; flex-direction: column; gap: 28px">
                        <div style="display: flex; flex-direction: column; gap: 10px">
                            <h1 style="margin: 0; font-size: 36px; letter-spacing: -0.02em; font-weight: 700">How do you
                                want to start?</h1>
                            <p style="margin: 0; font-size: 17px; line-height: 1.55; color: #9BA5B3">You can always do
                                the other one later.</p>
                        </div>
                        <div style="display: flex; flex-wrap: wrap; gap: 16px">
                            <sc-for list="{{ starts }}" as="o" hint-placeholder-count="2">
                                <button type="button" onClick="{{ o.pick }}"
                                    style="flex: 1 1 300px; box-sizing: border-box; min-height: 160px; display: flex; flex-direction: column; justify-content: flex-start; gap: 10px; text-align: left; padding: 22px; background: {{ o.bg }}; border: 2px solid {{ o.border }}; border-radius: 14px; color: #E8ECF1; font: inherit; cursor: pointer">
                                    <span style="font-size: 20px; font-weight: 600">{{ o.title }}</span>
                                    <span style="font-size: 15px; line-height: 1.55; color: #9BA5B3">{{ o.text }}</span>
                                </button>
                            </sc-for>
                        </div>
                    </div>
                </sc-if>

                <sc-if value="{{ isStep3 }}" hint-placeholder-val="{{ false }}">
                    <div style="display: flex; flex-direction: column; gap: 28px">
                        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#4ADE9A" stroke-width="1.8"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="12" r="9" />
                            <path d="M8 12.5l2.7 2.7L16 9.5" />
                        </svg>
                        <div style="display: flex; flex-direction: column; gap: 10px">
                            <h1 style="margin: 0; font-size: 36px; letter-spacing: -0.02em; font-weight: 700">Your
                                cockpit is ready</h1>
                            <p style="margin: 0; font-size: 17px; line-height: 1.55; color: #9BA5B3">{{ doneText }}</p>
                        </div>
                        <a href="{{ finishHref }}"
                            style="display: flex; align-items: center; justify-content: center; width: fit-content; min-height: 52px; padding: 0 32px; background: #7FA3FF; color: #0B1020; border-radius: 12px; font-size: 17px; font-weight: 600; text-decoration: none">{{
                            finishLabel }}</a>
                    </div>
                </sc-if>

                <sc-if value="{{ showNav }}" hint-placeholder-val="{{ true }}">
                    <div
                        style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-top: 8px">
                        <button type="button" onClick="{{ back }}"
                            style="min-height: 48px; padding: 0 20px; background: transparent; color: #E8ECF1; border: 1px solid #4A5565; border-radius: 12px; font: inherit; font-size: 16px; cursor: pointer">Back</button>
                        <button type="button" onClick="{{ next }}"
                            style="min-height: 48px; padding: 0 28px; background: #7FA3FF; color: #0B1020; border: 0; border-radius: 12px; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer">Continue</button>
                    </div>
                </sc-if>

            </div>
        </div>
    </x-dc>
    <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { step: 1, role: 'legal', start: 'demo' };
}
renderVals() {
const { step, role, start } = this.state;
const labels = ['01 · YOU', '02 · START', '03 · READY'];
const steps = labels.map((l, i) => ({
label: l,
bar: step >= i + 1 ? '#7FA3FF' : '#2A323D',
color: step >= i + 1 ? '#E8ECF1' : '#9BA5B3'
}));
const roleDefs = [
{ id: 'legal', title: 'Legal counsel', hint: 'Review clauses and commitments' },
{ id: 'cto', title: 'CTO or tech lead', hint: 'Check promises against architecture' },
{ id: 'procurement', title: 'Procurement', hint: 'Prepare negotiations with proof' },
{ id: 'sales', title: 'Sales engineer', hint: 'Align proposals with what ships' }
];
const roles = roleDefs.map((r) => ({
title: r.title, hint: r.hint,
bg: role === r.id ? '#1B222B' : '#151A21',
border: role === r.id ? '#7FA3FF' : '#2A323D',
pick: () => this.setState({ role: r.id })
}));
const startDefs = [
{ id: 'demo', title: 'Load a demo deal', text: 'Open a ready-made contract with 8 promises and see a full audit in one click.' },
{ id: 'own', title: 'Upload my documents', text: 'Drop your commercial proposal and your technical specs to audit a real deal.' }
];
const starts = startDefs.map((o) => ({
title: o.title, text: o.text,
bg: start === o.id ? '#1B222B' : '#151A21',
border: start === o.id ? '#7FA3FF' : '#2A323D',
pick: () => this.setState({ start: o.id })
}));
return {
steps, roles, starts,
isStep1: step === 1,
isStep2: step === 2,
isStep3: step === 3,
showNav: step < 3,
next: () => this.setState({ step: Math.min(3, step + 1) }),
back: () => this.setState({ step: Math.max(1, step - 1) }),
doneText: start === 'demo' ? 'The demo deal is loaded. Open it to see the verdicts appear.' : 'Drop your two documents in the cockpit to run your first audit.',
finishHref: start === 'demo' ? 'Audit.dc.html' : 'Main.dc.html',
finishLabel: start === 'demo' ? 'Open the demo audit' : 'Open my cockpit'
};
}
}
</script>
</body>

</html>
